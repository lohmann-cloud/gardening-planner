import java.time.Instant

plugins {
    id 'java'
    id 'io.quarkus'
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")
    implementation 'io.quarkus:quarkus-hibernate-orm-panache'
    implementation 'io.quarkus:quarkus-rest'
    implementation 'io.quarkus:quarkus-rest-jackson'
    implementation 'io.quarkus:quarkus-smallrye-openapi'
    implementation 'io.quarkus:quarkus-jdbc-postgresql'
    implementation 'io.quarkus:quarkus-liquibase'
    implementation 'io.quarkus:quarkus-arc'
    implementation 'io.quarkus:quarkus-hibernate-validator'
    testImplementation 'io.quarkus:quarkus-junit5'
}

group 'de.gardenplanner'
version '1.0.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

test {
    systemProperty "java.util.logging.manager", "org.jboss.logmanager.LogManager"
}
compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

compileTestJava {
    options.encoding = 'UTF-8'
}

// Stamp build-info.properties with the git commit and build time. In CI these
// come from the GIT_SHA / BUILD_TIME env vars; locally they fall back to git
// and the current instant.
def resolveGitSha = {
    def envSha = System.getenv('GIT_SHA')
    if (envSha) return envSha.take(7)
    try {
        def proc = new ProcessBuilder('git', 'rev-parse', '--short', 'HEAD')
            .directory(rootDir).redirectErrorStream(true).start()
        proc.waitFor()
        def out = proc.inputStream.text.trim()
        return out ? out.take(7) : 'unknown'
    } catch (ignored) {
        return 'unknown'
    }
}
def buildGitSha = resolveGitSha()
def buildTime = System.getenv('BUILD_TIME') ?: Instant.now().toString()

processResources {
    inputs.property('gitSha', buildGitSha)
    inputs.property('buildTime', buildTime)
    filesMatching('build-info.properties') {
        expand(gitSha: buildGitSha, buildTime: buildTime)
    }
}
